<script>
(()=>{"use strict";
const DOSYA='index.sayfa.json', SUN='https://hc-orbit.turkerhc.workers.dev', AN='cx-anahtar', KK='cx-kullanici', ESKI={turker:'Türker',serkan:'Serkan'};
const te=new TextEncoder(), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), eb=s=>{ let r=''; const u=new Uint8Array(s); for(let i=0;i<u.length;i+=8192) r+=String.fromCharCode(...u.subarray(i,i+8192)); return btoa(r); };
const hx=u=>[...new Uint8Array(u)].map(x=>x.toString(16).padStart(2,'0')).join('');
const kN=s=>String(s||'').trim().toLocaleLowerCase('tr').replace(/ü/g,'u').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ö/g,'o').replace(/ç/g,'c');
const al=k=>{ try{ return sessionStorage.getItem(k)||localStorage.getItem(k); }catch(e){ return null; } };
const koy=(k,v,kal)=>{ try{ sessionStorage.setItem(k,v); if(kal) localStorage.setItem(k,v); }catch(e){} };
const sil=()=>{ try{ [AN,KK].forEach(k=>{ sessionStorage.removeItem(k); localStorage.removeItem(k); }); }catch(e){} };
const $=i=>document.getElementById(i);
async function pb(sifre,tuz,it,bit){ const km=await crypto.subtle.importKey('raw',te.encode(sifre),'PBKDF2',false,['deriveBits']); return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:tuz,iterations:it},km,bit)); }
async function hm(key,msg){ const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']); return new Uint8Array(await crypto.subtle.sign('HMAC',k,msg)); }
async function akis(ka,n,len){ const J=[]; for(let i=0;i<Math.ceil(len/32);i++){ const m=new Uint8Array(n.length+4); m.set(n); new DataView(m.buffer).setUint32(n.length,i); J.push(hm(ka,m)); } return (await Promise.all(J)); }
async function cozHam(P,a){ const n=b64(P.n), c=b64(P.c); const t=await hm(a.slice(32,64),(()=>{ const m=new Uint8Array(n.length+c.length); m.set(n); m.set(c,n.length); return m; })());
  if(eb(t)!==P.t) throw new Error('etiket'); const A=await akis(a.slice(0,32),n,c.length); const o=new Uint8Array(c.length); for(let i=0;i<c.length;i++) o[i]=c[i]^A[i>>5][i&31]; return o; }
async function sar(veri,a){ const n=crypto.getRandomValues(new Uint8Array(16)), A=await akis(a.slice(0,32),n,veri.length), c=new Uint8Array(veri.length);
  for(let i=0;i<veri.length;i++) c[i]=veri[i]^A[i>>5][i&31]; const nc=new Uint8Array(16+c.length); nc.set(n); nc.set(c,16); return {n:eb(n),c:eb(c),t:eb(await hm(a.slice(32,64),nc))}; }
async function coz(P,a){ const [tuz,kb]=a.split('|'); if(tuz!==P.s) throw new Error('tuz');
  const k=b64(kb), n=b64(P.n), c=b64(P.c), s=b64(P.s), msg=new Uint8Array(s.length+n.length+c.length); msg.set(s); msg.set(n,s.length); msg.set(c,s.length+n.length);
  if(eb(await hm(k.slice(32),msg))!==P.t) throw new Error('etiket');
  const A=await akis(k.slice(0,32),n,c.length); let o=new Uint8Array(c.length); for(let i=0;i<c.length;i++) o[i]=c[i]^A[i>>5][i&31];
  if(P.z) o=new Uint8Array(await new Response(new Blob([o]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
  return new TextDecoder().decode(o); }
const kimlik=async ad=>hx(await crypto.subtle.digest('SHA-256',te.encode('hccortex|'+kN(ad)))).slice(0,24);
async function kilitAl(){ try{ const j=await (await fetch(SUN+'/cx/kilit',{cache:'no-store'})).json(); if(j&&j.k&&j.k.k) return j.k.k; }catch(_){}
  try{ const j=await (await fetch('cx_kilit.json?t='+Date.now(),{cache:'no-store'})).json(); if(j&&j.k) return j.k; }catch(_){} return null; }
function yaz(html){ document.open(); document.write(html); document.close(); }
let P=null, KL=null;
async function girisYap(ad,sifre,kal){ const u=await kimlik(ad), e=KL&&KL[u];
  let anah;
  if(e){ const a=await pb(sifre,b64(e.s),e.i,512), t=new TextDecoder().decode(await cozHam(e.w,a)); if(t[0]==='{'){ const o=JSON.parse(t); anah=o.k; ad=o.ad||ad; } else { anah=t; ad=e.ad||ad; } }
  else if(!KL&&ESKI[kN(ad)]){ anah=P.s+'|'+eb(await pb(sifre,b64(P.s),P.i,512)); ad=ESKI[kN(ad)]; }
  else throw new Error('yok');
  const html=await coz(P,anah); koy(AN,anah,kal); koy(KK,ad,kal); yaz(html); }
const sallaF=(f,h,m)=>{ h.textContent=m; f.classList.remove('salla'); void f.offsetWidth; f.classList.add('salla'); };
Promise.all([fetch(DOSYA+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),kilitAl()]).then(async([p,kl])=>{ P=p; KL=kl;
  const a=al(AN), u=al(KK);
  if(a&&u&&!/davet=/.test(location.hash)){ try{ yaz(await coz(P,a)); return; }catch(e){ sil(); } }
  $('y').hidden=true; const f=$('f'); f.hidden=false; setTimeout(()=>$('ad').focus(),200);
  f.onsubmit=async ev=>{ ev.preventDefault(); const b=$('b'), h=$('h'); h.textContent=''; b.disabled=true; b.textContent='…';
    try{ await girisYap($('ad').value,$('sf').value,$('ha').checked); }
    catch(e){ sallaF(f,h,e.message==='yok'?'Kullanıcı bulunamadı':'Şifre yanlış'); b.disabled=false; b.textContent='AÇ'; } };
  const dv=$('d'), AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const davetAc=kod=>{ f.hidden=true; dv.hidden=false; if(kod){ const k=kod.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16); $('dk').value=(k.match(/.{1,4}/g)||[]).join('-'); } setTimeout(()=>($('dk').value?$('dad'):$('dk')).focus(),150); };
  $('dvA').onclick=()=>davetAc(''); $('dvG').onclick=()=>{ dv.hidden=true; f.hidden=false; try{ history.replaceState(null,'',location.pathname); }catch(_){} };
  $('dk').addEventListener('input',e=>{ const k=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16); e.target.value=(k.match(/.{1,4}/g)||[]).join('-'); });
  { const m=location.hash.match(/davet=([A-Za-z0-9-]+)/); if(m) davetAc(m[1]); }
  dv.onsubmit=async ev=>{ ev.preventDefault(); const h=$('dh'), b=$('db'); h.textContent='';
    const kod=$('dk').value.toUpperCase().replace(/[^A-Z0-9]/g,''), ad=$('dad').value.trim().replace(/\s+/g,' '), s1=$('ds1').value, s2=$('ds2').value;
    if(!/^[A-HJ-NP-Z2-9]{16}$/.test(kod)) return sallaF(dv,h,'Davet kodu 16 karakter olmalı.');
    if(!/^[\p{L}\p{N}][\p{L}\p{N} ._-]{1,22}[\p{L}\p{N}]$/u.test(ad)||kN(ad).length<3) return sallaF(dv,h,'Kullanıcı adı 3–24 karakter olmalı.');
    if(s1.length<8) return sallaF(dv,h,'Şifre en az 8 karakter olmalı.');
    if(s1!==s2) return sallaF(dv,h,'Şifreler aynı değil.');
    b.disabled=true; b.textContent='…';
    try{ const u=await kimlik(ad), tz=crypto.getRandomValues(new Uint8Array(16));
      const [a,Kd]=await Promise.all([pb(s1,tz,600000,512),pb(kod,te.encode('hccortex-davet|'+kod.slice(0,4)),300000,768)]);
      const c=await sar(a,Kd.slice(0,64));
      const r=await fetch(SUN+'/cx/katil',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:kod.slice(0,4),p:hx(Kd.slice(64)),u,ad,s:eb(tz),c})});
      const j=await r.json().catch(()=>({})); if(!r.ok||!j.q) throw new Error(r.status===429?'Çok fazla deneme — biraz sonra tekrar dene.':'Gönderilemedi, tekrar dene.');
      const o=$('do'); o.hidden=false; o.textContent='✓ Gönderildi — hesabın hazırlanıyor (genelde 1–2 dakika). Bu sayfayı kapatma.'; b.hidden=true;
      try{ history.replaceState(null,'',location.pathname); }catch(_){}
      const bas=Date.now(); const z=setInterval(async()=>{ try{ const q=await (await fetch(SUN+'/cx/katil?q='+j.q,{cache:'no-store'})).json();
          if(q.r){ clearInterval(z); if(!q.r.ok){ o.hidden=true; b.hidden=false; b.disabled=false; b.textContent='HESABIMI OLUŞTUR'; return sallaF(dv,h,q.r.m||'Olmadı.'); }
            o.textContent='✓ '+q.r.m+' Giriş yapılıyor…'; for(let i=0;i<12;i++){ KL=await kilitAl(); if(KL&&KL[u]) break; await new Promise(z_=>setTimeout(z_,5000)); }
            await girisYap(ad,s1,true); } }catch(_){}
        if(Date.now()-bas>15*60e3){ clearInterval(z); o.textContent='Hesabın henüz açılmadı (sistem kapalı olabilir). Davetin kayıtlı; biraz sonra kullanıcı adın ve şifrenle giriş yap.'; } },10000); }
    catch(e){ b.disabled=false; b.textContent='HESABIMI OLUŞTUR'; sallaF(dv,h,e.message||'Bir sorun oldu.'); } };
}).catch(()=>{ $('y').textContent='Yüklenemedi · sayfayı yenile'; });
})();
</script></body></html>
