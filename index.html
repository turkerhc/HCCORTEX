<form id="f" hidden autocomplete="on"><div class="kt">HC<b>·</b>CORTEX</div><div class="ks">Kullanıcı adın ve şifrenle giriş yap</div>
<input id="ad" type="text" name="username" placeholder="Kullanıcı adı" autocomplete="username" autocapitalize="words" spellcheck="false" required>

<script>
(()=>{"use strict";
const DOSYA='index.sayfa.json', AN='cx-anahtar', KK='cx-kullanici', KUL={turker:'Türker',serkan:'Serkan'};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), eb=s=>btoa(String.fromCharCode(...new Uint8Array(s)));
const kN=s=>String(s||'').trim().toLocaleLowerCase('tr').replace(/ü/g,'u').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ö/g,'o').replace(/ç/g,'c');
const al=k=>{ try{ return sessionStorage.getItem(k)||localStorage.getItem(k); }catch(e){ return null; } };
const koy=(k,v,kal)=>{ try{ sessionStorage.setItem(k,v); if(kal) localStorage.setItem(k,v); }catch(e){} };
const sil=()=>{ try{ [AN,KK].forEach(k=>{ sessionStorage.removeItem(k); localStorage.removeItem(k); }); }catch(e){} };
async function turet(sifre,P){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(sifre),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.s),iterations:P.i},km,512); return P.s+'|'+eb(bits); }
async function coz(P,a){ const [tuz,kb]=a.split('|'); if(tuz!==P.s) throw new Error('tuz');
  const k=b64(kb), n=b64(P.n), c=b64(P.c), t=b64(P.t), s=b64(P.s);
  const mk=await crypto.subtle.importKey('raw',k.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  const msg=new Uint8Array(s.length+n.length+c.length); msg.set(s); msg.set(n,s.length); msg.set(c,s.length+n.length);
  if(!await crypto.subtle.verify('HMAC',mk,t,msg)) throw new Error('etiket');
  const ek=await crypto.subtle.importKey('raw',k.slice(0,32),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const J=[]; for(let i=0;i<Math.ceil(c.length/32);i++){ const m=new Uint8Array(n.length+4); m.set(n); new DataView(m.buffer).setUint32(n.length,i); J.push(crypto.subtle.sign('HMAC',ek,m)); }
  const A=(await Promise.all(J)).map(b=>new Uint8Array(b)); let o=new Uint8Array(c.length); for(let i=0;i<c.length;i++) o[i]=c[i]^A[i>>5][i&31];
  if(P.z) o=new Uint8Array(await new Response(new Blob([o]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
  return new TextDecoder().decode(o); }
function yaz(html){ document.open(); document.write(html); document.close(); }
const $=i=>document.getElementById(i);
fetch(DOSYA+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(async P=>{
  const a=al(AN), u=al(KK);
  if(a&&u){ try{ yaz(await coz(P,a)); return; }catch(e){ sil(); } }
  $('y').hidden=true; const f=$('f'); f.hidden=false; setTimeout(()=>$('ad').focus(),200);
  f.onsubmit=async ev=>{ ev.preventDefault(); const b=$('b'), h=$('h'); h.textContent=''; const ad=KUL[kN($('ad').value)];
    const hata=m=>{ h.textContent=m; f.classList.remove('salla'); void f.offsetWidth; f.classList.add('salla'); b.disabled=false; b.textContent='AÇ'; };
    if(!ad) return hata('Kullanıcı bulunamadı');
    b.disabled=true; b.textContent='…';
    try{ const k=await turet($('sf').value,P); const html=await coz(P,k); const kal=$('ha').checked; koy(AN,k,kal); koy(KK,ad,kal); yaz(html); }
    catch(e){ hata('Şifre yanlış'); } };
}).catch(()=>{ $('y').textContent='Yüklenemedi · sayfayı yenile'; });
})();
